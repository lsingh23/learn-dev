<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NN — Component Name</title>
<style>
  :root{
    --bg:#fbfaf8; --card:#fff; --ink:#1f2430; --muted:#5c6478; --line:#e4e2dd;
    --accent:#2f5fd8; --state:#2f5fd8; --dom:#127a5b; --bug:#b3261e; --user:#9a6400;
    --state-bg:#eaf0fe; --dom-bg:#e6f5ef; --bug-bg:#fdecea; --user-bg:#fff6e5;
    --code-bg:#1e222b; --code-ink:#e6e9ef;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:780px;margin:0 auto}
  a{color:var(--accent)}
  .back{font-size:.85rem;color:var(--muted);text-decoration:none}
  h1{font-size:2rem;line-height:1.15;letter-spacing:-.02em;margin:.6rem 0 .3rem}
  .sub{color:var(--muted);margin:0 0 2rem}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    margin:3rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
  h3{font-size:1.02rem;margin:1.8rem 0 .5rem}
  p{margin:.7rem 0}
  ul,ol{margin:.7rem 0;padding-left:1.2rem}
  li{margin:.3rem 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
    background:#eeece7;border-radius:4px;padding:.1em .35em}
  pre{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:1rem 1.1rem;
    overflow-x:auto;margin:.9rem 0;font-size:.86rem;line-height:1.6}
  pre code{background:none;padding:0;color:inherit;font-size:1em}
  .cmt{color:#8b95a7}
  .hi{color:#ffd479}

  /* the ask */
  .ask{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:8px;padding:1rem 1.2rem;margin:1rem 0;font-size:1.02rem}
  .ask .who{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:.35rem}

  /* mockup canvas */
  .mock{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.5rem;
    margin:1rem 0;font-size:.9rem}
  .mock-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
    margin-bottom:.9rem}
  .note{font-size:.72rem;color:var(--user);background:var(--user-bg);border:1px solid #f0dcb4;
    border-radius:5px;padding:.12rem .45rem;display:inline-block}
  .ui{border:1px solid #d9d6d0;border-radius:8px;padding:.9rem;background:#fdfdfc}
  .btn{display:inline-block;border:1px solid #cfd3dc;border-radius:6px;padding:.35rem .7rem;
    background:#f4f5f7;font-size:.85rem}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .inp{border:1px solid #cfd3dc;border-radius:6px;padding:.4rem .6rem;background:#fff;
    color:var(--muted);font-size:.85rem}
  .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

  /* callouts */
  .box{border-radius:9px;padding:.85rem 1.1rem;margin:1rem 0;font-size:.94rem;border:1px solid}
  .box p:first-child{margin-top:0} .box p:last-child{margin-bottom:0}
  .box b{display:block;margin-bottom:.2rem}
  .tip{background:var(--state-bg);border-color:#c3d4fb}
  .warn{background:var(--bug-bg);border-color:#f3c9c4}
  .ok{background:var(--dom-bg);border-color:#bfe4d5}
  .key{background:var(--user-bg);border-color:#f0dcb4}

  /* layers */
  .layer{border:1px solid var(--line);border-radius:10px;background:var(--card);
    padding:.2rem 1.1rem 1rem;margin:1rem 0}
  .layer h3{display:flex;align-items:center;gap:.6rem}
  .lnum{background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;border-radius:5px;
    padding:.2rem .45rem;letter-spacing:.04em}

  /* gotchas / follow-ups */
  .gotcha{border-left:3px solid var(--bug);padding:.15rem 0 .15rem .9rem;margin:1.1rem 0}
  .gotcha b{color:var(--bug)}
  .qa{border-left:3px solid var(--line);padding:.15rem 0 .15rem .9rem;margin:1.1rem 0}
  .qa b{display:block}

  /* say this */
  .say{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem 1.1rem;
    margin:1rem 0}
  .say li{margin:.6rem 0;font-style:italic;color:#333a4a}

  /* small tables & legends */
  table{border-collapse:collapse;width:100%;font-size:.9rem;margin:1rem 0}
  th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  svg{max-width:100%;height:auto;display:block;margin:1rem auto}
  @media (max-width:520px){ body{font-size:16px;padding-top:1.5rem} h1{font-size:1.6rem} }
</style>
</head>

</div>
</body>
</html>
